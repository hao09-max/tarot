<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神秘塔罗占卜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:radial-gradient(circle at top left,#1a0b2e,#0d0d1a);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:420px;text-align:center;color:#e0d7ff}
h1{font-size:2.8rem;margin-bottom:10px;background:linear-gradient(135deg,#c9a8ff,#ffb3e6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#aa9ec9;margin-bottom:30px}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:25px}
.btn{padding:12px 28px;border-radius:30px;border:none;font-size:1rem;font-weight:bold;cursor:pointer;background:rgba(255,255,255,0.08);color:#d1c4ff;border:1px solid rgba(200,150,255,0.3)}
.btn.active{background:linear-gradient(135deg,#6c3faa,#c34d9b);color:#fff;border-color:transparent;box-shadow:0 0 20px rgba(180,100,255,0.5)}
.card-area{background:rgba(0,0,0,0.3);border-radius:30px;padding:25px 20px;margin-top:10px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card-img{font-size:6rem;margin-bottom:10px;filter:drop-shadow(0 0 15px rgba(255,215,0,0.6))}
.card-img.reversed{transform:rotate(180deg)}
.card-name{font-size:1.6rem;font-weight:bold;margin:10px 0 5px;color:#f0e5ff}
.card-position{color:#b89fff;margin-bottom:15px}
.card-desc{font-size:0.9rem;color:#cbbfef;line-height:1.6;text-align:left;padding:0 10px}
.three-cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.mini-card{flex:1 1 100px;background:rgba(0,0,0,0.3);border-radius:20px;padding:15px 8px;text-align:center;min-width:90px}
.mini-card .card-img{font-size:3.5rem}
.mini-card .card-name{font-size:0.8rem;margin:5px 0}
.mini-card .card-desc{font-size:0.7rem;text-align:center}
</style>
</head>
<body>
<div class="container">
<h1>🔮 神秘塔罗</h1>
<div class="subtitle">静心默念问题，然后抽牌</div>
<div class="controls">
<button class="btn active" id="singleBtn">单张指引</button>
<button class="btn" id="threeBtn">过去·现在·未来</button>
</div>
<div class="card-area" id="cardArea">✨ 点击下方按钮抽牌 ✨</div>
<button class="btn" style="margin-top:20px;width:100%" id="drawBtn">🃏 抽取塔罗牌</button>
</div>
<script>
const deck=[{n:"愚者",e:"🃏",u:"新的开始，冒险，天真。",r:"鲁莽，错失机会。"},{n:"魔术师",e:"🪄",u:"创造力，自信，成功在望。",r:"欺诈，计划受阻。"},{n:"女祭司",e:"🔮",u:"直觉，内在智慧。",r:"忽视直觉，隐藏的秘密。"},{n:"皇后",e:"👑",u:"丰收，母性，创造力。",r:"依赖，缺乏安全感。"},{n:"皇帝",e:"🏰",u:"权威，稳定，领导力。",r:"专制，权力滥用。"},{n:"教皇",e:"⛪",u:"传统，信仰，学习。",r:"教条，错误建议。"},{n:"恋人",e:"💞",u:"爱情，和谐，选择。",r:"分离，冲突。"},{n:"战车",e:"🏇",u:"胜利，决心，前进。",r:"失控，方向迷失。"},{n:"力量",e:"🦁",u:"勇气，耐心，克服恐惧。",r:"软弱，冲动。"},{n:"隐士",e:"🏮",u:"内省，寻求真理。",r:"孤立，逃避。"},{n:"命运之轮",e:"🎡",u:"转折，机遇，幸运。",r:"厄运，停滞。"},{n:"正义",e:"⚖️",u:"公平，责任，真相。",r:"不公，偏见。"},{n:"倒吊人",e:"🪢",u:"牺牲，换位思考。",r:"停滞，无谓牺牲。"},{n:"死神",e:"💀",u:"结束，转变，重生。",r:"抗拒改变，恐惧。"},{n:"节制",e:"🕊️",u:"平衡，调和，耐心。",r:"极端，放纵。"},{n:"恶魔",e:"👹",u:"欲望，束缚，物质主义。",r:"挣脱，觉醒。"},{n:"高塔",e:"🗼",u:"突变，摧毁，启示。",r:"逃避，恐惧。"},{n:"星星",e:"⭐",u:"希望，灵感，疗愈。",r:"失望，失去信心。"},{n:"月亮",e:"🌙",u:"幻觉，恐惧，潜意识。",r:"清醒，克服恐惧。"},{n:"太阳",e:"☀️",u:"快乐，成功，活力。",r:"挫折，忧伤。"},{n:"审判",e:"📯",u:"复活，召唤，宽恕。",r:"自我怀疑，遗憾。"},{n:"世界",e:"🌍",u:"完成，圆满，成就。",r:"未完成，延迟。"}];
let mode='single';
document.getElementById('singleBtn').onclick=()=>{mode='single';document.getElementById('singleBtn').classList.add('active');document.getElementById('threeBtn').classList.remove('active');document.getElementById('cardArea').innerHTML='✨ 点击下方按钮抽牌 ✨';};
document.getElementById('threeBtn').onclick=()=>{mode='three';document.getElementById('threeBtn').classList.add('active');document.getElementById('singleBtn').classList.remove('active');document.getElementById('cardArea').innerHTML='✨ 点击下方按钮抽牌 ✨';};
function draw(){const idx=Math.floor(Math.random()*deck.length);const c=deck[idx];c.rev=Math.random()<0.5;return c;}
document.getElementById('drawBtn').onclick=()=>{
  if(mode==='single'){const c=draw();document.getElementById('cardArea').innerHTML=`<div class="card-img${c.rev?' reversed':''}">${c.e}</div><div class="card-name">${c.n}${c.rev?'(逆位)':'(正位)'}</div><div class="card-position">—— 你的指引 ——</div><div class="card-desc">${c.rev?c.r:c.u}</div>`;}
  else{const p=draw(),n=draw(),f=draw();document.getElementById('cardArea').innerHTML=`<div class="three-cards"><div class="mini-card"><div class="card-img${p.rev?' reversed':''}">${p.e}</div><div class="card-name">${p.n}${p.rev?'(逆)':''}</div><div class="card-desc"><b>过去</b><br>${p.rev?p.r:p.u}</div></div><div class="mini-card"><div class="card-img${n.rev?' reversed':''}">${n.e}</div><div class="card-name">${n.n}${n.rev?'(逆)':''}</div><div class="card-desc"><b>现在</b><br>${n.rev?n.r:n.u}</div></div><div class="mini-card"><div class="card-img${f.rev?' reversed':''}">${f.e}</div><div class="card-name">${f.n}${f.rev?'(逆)':''}</div><div class="card-desc"><b>未来</b><br>${f.rev?f.r:f.u}</div></div></div>`;}
};
</script>
</body>
</html>
