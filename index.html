// ---------- 音频处理 ----------
let audioCtx = null, bgMusicPlaying = false, musicGain = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playDrawSound() {
  initAudio();
  const now = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator();
  const gain1 = audioCtx.createGain(), gain2 = audioCtx.createGain();
  osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, now); osc1.frequency.exponentialRampToValueAtTime(440, now + 0.5);
  osc2.type = 'triangle'; osc2.frequency.setValueAtTime(1175, now + 0.1); osc2.frequency.exponentialRampToValueAtTime(587, now + 0.6);
  gain1.gain.setValueAtTime(0.3, now); gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
  gain2.gain.setValueAtTime(0.2, now + 0.1); gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
  osc1.connect(gain1).connect(audioCtx.destination); osc1.start(now); osc1.stop(now + 0.8);
  osc2.connect(gain2).connect(audioCtx.destination); osc2.start(now + 0.1); osc2.stop(now + 0.9);
}
function startBgMusic() {
  initAudio();
  if (bgMusicPlaying) return;
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.15; musicGain.connect(audioCtx.destination);
  const oscLow = audioCtx.createOscillator(); oscLow.type='sine'; oscLow.frequency.value=110;
  const gainLow = audioCtx.createGain(); gainLow.gain.value=0.1; oscLow.connect(gainLow).connect(musicGain); oscLow.start();
  const oscHigh = audioCtx.createOscillator(); oscHigh.type='sine'; oscHigh.frequency.value=440;
  const gainHigh = audioCtx.createGain(); gainHigh.gain.value=0.05; oscHigh.connect(gainHigh).connect(musicGain); oscHigh.start();
  const lfo = audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.2; const lfoGain = audioCtx.createGain(); lfoGain.gain.value=20; lfo.connect(lfoGain).connect(oscLow.frequency); lfo.start();
  bgMusicPlaying = true; document.getElementById('musicToggle').textContent = '🔊 背景音乐：开';
}
function stopBgMusic() {
  if (!bgMusicPlaying) return;
  musicGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
  setTimeout(() => { if (audioCtx) audioCtx.close(); audioCtx=null; bgMusicPlaying=false; document.getElementById('musicToggle').textContent='🔇 背景音乐：关'; }, 1100);
}
function toggleMusic() { bgMusicPlaying ? stopBgMusic() : startBgMusic(); }
